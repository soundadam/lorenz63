# report/ 原样发到 GitHub Pages；首页就是幻灯片，打印稿和图在各自的相对路径上
name: pages
on:
  push:
    branches: [main]
    paths: [report/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp report/slides.html report/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: report
      - id: deployment
        uses: actions/deploy-pages@v4
